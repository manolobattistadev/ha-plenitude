<!doctype html>
<!--
  Visual check of the cards with a fake `hass` and SYNTHETIC data (no real consumption).
  Open in a browser, or screenshot:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --screenshot=/tmp/cards.png --window-size=1180,2300 --virtual-time-budget=4000 \
    "file://$PWD/tests/frontend/harness.html"
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plenitude cards harness</title>
<style>
  body { margin: 0; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .theme { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .light {
    background: #fafafa; --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0,0,0,.12);
    --primary-color: #03a9f4; --text-primary-color: #fff; --card-background-color: #ffffff;
  }
  .dark {
    background: #111111; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: rgba(225,225,225,.12);
    --primary-color: #03a9f4; --text-primary-color: #fff; --card-background-color: #1c1c1c;
  }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--secondary-text-color); font-weight: 500; }
</style>
<script>
  // Stand-in for Home Assistant's ha-card.
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() {
      this.style.display = "block";
      this.style.background = "var(--card-background-color)";
      this.style.borderRadius = "12px";
      this.style.boxShadow = "0 0 0 1px var(--divider-color)";
    }
  });
  // Stand-in for the frontend's root element: the cards are defined once it exists.
  customElements.define("home-assistant", class extends HTMLElement {});
</script>
<script src="../../custom_components/plenitude/frontend/plenitude-cards.js"></script>
</head>
<body>
<pre id="report">pending</pre>
<section class="theme light" id="light"><h1>Tema chiaro</h1></section>
<section class="theme dark" id="dark"><h1>Tema scuro</h1></section>
<section class="theme light" id="english"><h1>English (user profile language)</h1></section>
<script>
  // ----- synthetic data: deterministic hourly profile, bands as in the ARERA table (no holidays here)
  const FIRST = new Date(2026, 0, 4).getTime();
  const LAST_DAY = "2026-11-20";
  const LAST = new Date(2026, 10, 21).getTime();
  const PRICES = { f1: 0.31, f2: 0.27, f3: 0.22 };
  // As plenitude/info sends them: ``yearly`` is euro per year (null for the costs per kWh and the percentages).
  const COSTS = [
    { name: "Quota fissa", kind: "monthly", amount: 8.5, exempt: false, yearly: 102 },
    { name: "Quota potenza", kind: "per_kw_monthly", amount: 1.85, power: 3, exempt: false, yearly: 66.6 },
    { name: "Canone RAI", kind: "yearly", amount: 90, exempt: true, yearly: 90 },
    { name: "Oneri di sistema", kind: "per_kwh", amount: 0.035, exempt: false, yearly: null },
    { name: "IVA", kind: "percent", amount: 10, yearly: null },
  ];
  const EXTRA = 0.035; // sum of the costs per kWh, as in the cost statistic
  const VAT = 1.1; // the percentage, on the energy and the costs per kWh
  const HOUR_PRICES = Object.fromEntries(Object.entries(PRICES).map(([b, p]) => [b, (p + EXTRA) * VAT]));
  const CATS = ["comfort_ambientale", "standby", "lavare", "elettronica_luci", "refrigerare", "cucinare", "ricarica_elettrica", "altro"];
  const NAMES = ["Comfort Ambientale (HVAC)", "Standby", "Lavare", "Elettronica e luci", "Refrigerare", "Cucinare", "Ricarica elettrica", "Altro"];
  const SHARES = [0.22, 0.12, 0.1, 0.16, 0.14, 0.1, 0.06, 0.1];
  const P = "plenitude:luce_demo";
  function band(t) {
    const d = new Date(t), h = d.getHours(), w = d.getDay();
    if (w === 0 || h < 7 || h >= 23) return "f3";
    if (w === 6) return "f2";
    return h >= 8 && h < 19 ? "f1" : "f2";
  }
  function kwh(t) {
    const d = new Date(t), h = d.getHours();
    const season = 1 + 0.35 * Math.cos(((d.getMonth() + 0.5) / 12) * 2 * Math.PI);
    const shape = 0.18 + 0.25 * Math.exp(-((h - 8) ** 2) / 4) + 0.45 * Math.exp(-((h - 20) ** 2) / 5);
    const noise = 0.85 + 0.3 * Math.abs(Math.sin(t / 3.7e6));
    return shape * season * noise;
  }
  function valueOf(id, t) {
    if (t < FIRST || t >= LAST) return null;
    const key = id.slice(P.length + 1);
    const v = kwh(t);
    if (key === "consumo") return v;
    // ?nocost: the cost statistic has no rows (being rewritten, or never written), as on a server on 2026-11-23.
    if (key === "costo") return location.search.includes("nocost") ? null : v * HOUR_PRICES[band(t)];
    if (key === "f1" || key === "f2" || key === "f3") return band(t) === key ? v : 0;
    return null;
  }
  function stepStart(t, period) {
    const d = new Date(t);
    if (period === "hour") return t + 3600000;
    if (period === "day") return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime();
    return new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime();
  }
  function statistics(msg) {
    const out = {};
    const start = Date.parse(msg.start_time), end = Date.parse(msg.end_time);
    for (const id of msg.statistic_ids) {
      const rows = [];
      const cat = CATS.findIndex((c) => id.endsWith("_cat_" + c));
      for (let b = start; b < end; b = stepStart(b, msg.period)) {
        const e = Math.min(stepStart(b, msg.period), end);
        let sum = null;
        for (let t = b; t < e; t += 3600000) {
          const v = cat >= 0 ? (valueOf(P + "_consumo", t) ?? null) : valueOf(id, t);
          if (v !== null) sum = (sum || 0) + (cat >= 0 ? v * SHARES[cat] : v);
        }
        if (sum !== null) rows.push({ start: b, end: e, change: sum });
      }
      out[id] = rows;
    }
    return out;
  }
  const requests = { info: 0, statistics: 0 };
  const connection = {}; // one connection for the page, as in Home Assistant
  function makeHass(dark, lang = "it") {
    return {
      language: lang, locale: { language: lang }, themes: { darkMode: dark }, connection,
      async callWS(msg) {
        if (msg.type === "plenitude/info") {
          requests.info += 1;
          return { entries: [{
            entry_id: "demo", title: "Plenitude luce", version: "harness", first_day: "2026-01-04", last_day: LAST_DAY, price_mode: "three", prices: PRICES,
            hour_prices: HOUR_PRICES, costs: COSTS, currency: "EUR",
            statistics: { consumo: P + "_consumo", f1: P + "_f1", f2: P + "_f2", f3: P + "_f3", costo: P + "_costo" },
            categories: CATS.map((c, i) => ({ key: c, name: NAMES[i], statistic_id: P + "_cat_" + c })),
          }] };
        }
        if (msg.type === "recorder/statistics_during_period") {
          requests.statistics += 1;
          await new Promise((resolve) => setTimeout(resolve, 200)); // a recorder that takes its time
          return statistics(msg);
        }
        throw new Error("unexpected " + msg.type);
      },
    };
  }
  const configs = [
    { type: "plenitude-consumption-card", period: "month", view: "bands" },
    { type: "plenitude-billing-card", start_date: "2026-11-01", months: "2" },
    { type: "plenitude-consumption-card", period: "day", view: "total", unit: "eur", title: "Costo orario" },
    { type: "plenitude-consumption-card", period: "year", view: "categories" },
    { type: "plenitude-consumption-card", period: "week", view: "bands", unit: "eur" },
    { type: "plenitude-billing-card", start_date: "2026-01-15", months: "2", title: "Bimestre dal 15" },
  ];
  const english = [
    { type: "plenitude-consumption-card", period: "week", view: "total", unit: "eur" },
    { type: "plenitude-consumption-card", period: "month", view: "categories" },
    { type: "plenitude-billing-card", start_date: "2026-11-01", months: "2" },
  ];
  for (const [section, dark, lang, list] of [
    ["light", false, "it", configs],
    ["dark", true, "it", configs.slice(0, 2)],
    ["english", false, "en", english],
  ]) {
    const hass = makeHass(dark, lang);
    for (const config of list) {
      const card = document.createElement(config.type);
      card.setConfig(config);
      document.getElementById(section).append(card);
      card.hass = hass;
    }
  }
  // Re-create the cards of the light theme, as Home Assistant does on every reconnection: they must show their
  // data at once, without new requests. The result is written in #report (read it with --dump-dom).
  setTimeout(() => {
    const before = { ...requests };
    const section = document.getElementById("light");
    const hass = makeHass(false, "it");
    const fresh = [];
    for (const old of [...section.querySelectorAll("plenitude-consumption-card, plenitude-billing-card")]) {
      const card = document.createElement(old.localName);
      card.setConfig(old._config);
      old.replaceWith(card);
      card.hass = hass;
      fresh.push(card);
    }
    queueMicrotask(() => setTimeout(() => {
      const loading = fresh.filter((card) => /Caricamento|Loading/.test(card.shadowRoot.textContent)).length;
      document.getElementById("report").textContent =
        `recreated=${fresh.length} loading=${loading} new_statistics_requests=${requests.statistics - before.statistics} ` +
        `new_info_requests=${requests.info - before.info} total_statistics_requests=${requests.statistics}`;
    }, 0));
  }, 1200);
  // Show one tooltip, as when hovering a column.
  setTimeout(() => {
    const card = document.querySelector("#light plenitude-consumption-card");
    const hits = card.shadowRoot.querySelectorAll(".hit");
    hits[18]?.dispatchEvent(new PointerEvent("pointerenter"));
  }, 1500);
</script>
</body>
</html>
