<!doctype html>
<!--
  Visual check of the cards with a fake `hass` and SYNTHETIC data (no real consumption).
  Open in a browser, or screenshot:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
    --screenshot=/tmp/cards.png --window-size=1180,2300 --virtual-time-budget=4000 \
    "file://$PWD/tests/frontend/harness.html"
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plenitude cards harness</title>
<style>
  body { margin: 0; font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .theme { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
  .light {
    background: #fafafa; --primary-text-color: #212121; --secondary-text-color: #727272; --divider-color: rgba(0,0,0,.12);
    --primary-color: #03a9f4; --text-primary-color: #fff; --card-background-color: #ffffff;
  }
  .dark {
    background: #111111; --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: rgba(225,225,225,.12);
    --primary-color: #03a9f4; --text-primary-color: #fff; --card-background-color: #1c1c1c;
  }
  h1 { grid-column: 1 / -1; margin: 0; font-size: 14px; color: var(--secondary-text-color); font-weight: 500; }
</style>
<script>
  // Stand-in for Home Assistant's ha-card.
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback() {
      this.style.display = "block";
      this.style.background = "var(--card-background-color)";
      this.style.borderRadius = "12px";
      this.style.boxShadow = "0 0 0 1px var(--divider-color)";
    }
  });
  // Stand-in for the frontend's root element: the cards are defined once it exists.
  customElements.define("home-assistant", class extends HTMLElement {});
</script>
<script src="../../custom_components/plenitude/frontend/plenitude-cards.js"></script>
<script src="fake-hass.js"></script>
</head>
<body>
<pre id="report">pending</pre>
<section class="theme light" id="light"><h1>Tema chiaro</h1></section>
<section class="theme dark" id="dark"><h1>Tema scuro</h1></section>
<section class="theme light" id="english"><h1>English (user profile language)</h1></section>
<script>
  const configs = [
    { type: "plenitude-consumption-card", period: "month", view: "bands" },
    { type: "plenitude-billing-card", start_date: "2026-11-01", months: "2" },
    { type: "plenitude-consumption-card", period: "day", view: "total", unit: "eur", title: "Costo orario" },
    { type: "plenitude-consumption-card", period: "year", view: "categories" },
    { type: "plenitude-consumption-card", period: "week", view: "bands", unit: "eur" },
    { type: "plenitude-billing-card", start_date: "2026-01-15", months: "2", title: "Bimestre dal 15" },
  ];
  const english = [
    { type: "plenitude-consumption-card", period: "week", view: "total", unit: "eur" },
    { type: "plenitude-consumption-card", period: "month", view: "categories" },
    { type: "plenitude-billing-card", start_date: "2026-11-01", months: "2" },
  ];
  for (const [section, dark, lang, list] of [
    ["light", false, "it", configs],
    ["dark", true, "it", configs.slice(0, 2)],
    ["english", false, "en", english],
  ]) {
    const hass = makeHass(dark, lang);
    for (const config of list) {
      const card = document.createElement(config.type);
      card.setConfig(config);
      document.getElementById(section).append(card);
      card.hass = hass;
    }
  }
  // Re-create the cards of the light theme, as Home Assistant does on every reconnection: they must show their
  // data at once, without new requests. The result is written in #report (read it with --dump-dom).
  setTimeout(() => {
    const before = { ...requests };
    const section = document.getElementById("light");
    const hass = makeHass(false, "it");
    const fresh = [];
    for (const old of [...section.querySelectorAll("plenitude-consumption-card, plenitude-billing-card")]) {
      const card = document.createElement(old.localName);
      card.setConfig(old._config);
      old.replaceWith(card);
      card.hass = hass;
      fresh.push(card);
    }
    queueMicrotask(() => setTimeout(() => {
      const loading = fresh.filter((card) => /Caricamento|Loading/.test(card.shadowRoot.textContent)).length;
      document.getElementById("report").textContent =
        `recreated=${fresh.length} loading=${loading} new_statistics_requests=${requests.statistics - before.statistics} ` +
        `new_info_requests=${requests.info - before.info} total_statistics_requests=${requests.statistics}`;
    }, 0));
  }, 1200);
  // Show one tooltip, as when hovering a column.
  setTimeout(() => {
    const card = document.querySelector("#light plenitude-consumption-card");
    const hits = card.shadowRoot.querySelectorAll(".hit");
    hits[18]?.dispatchEvent(new PointerEvent("pointerenter"));
  }, 1500);
</script>
</body>
</html>
