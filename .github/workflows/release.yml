name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/plenitude/manifest.json'))['version'])")
          if [ "$version" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi
      - name: Release notes from the changelog
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
